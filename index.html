<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, canonical address, sharing tags and structured
         data are set per page (src/components/SEO.tsx), written into each
         page at build time by scripts/prerender.js -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />

    <!-- Page colour before the styles load, light or dark like the system -->
    <style>
      html, body { background-color: #ffffff; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background-color: #111111; } }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #111111; }
    </style>
    <!-- The light/dark choice from the switch, applied before first paint -->
    <script>
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>

    <!-- Google Fonts: Inter, one grotesk throughout -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="oc">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
